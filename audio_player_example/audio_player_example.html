<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁音樂播放範例</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .player-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h2>🎶 網頁音樂播放器範例</h2>
        <p>這是一個簡單的 HTML 網頁音樂播放範例。在實務上，我們會將聲音檔放在相對路徑的資料夾中。</p>
        
        <!-- 音樂播放器標籤 -->
        <audio controls>
            <source src="audio/bgm.mp3" type="audio/mpeg">
            您的瀏覽器不支援 audio 標籤。
        </audio>
    </div>
</body>
</html>
